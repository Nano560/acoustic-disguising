[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-disguising-mdd"
version = "1.0.0"
description = "Multi-Dimensional Deconvolution for extracting Green's functions from reverberant acoustic data. Companion code to the paper 'Acoustic disguising: a unified framework for cloaking and holography'."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jonas Müller", email = "jmuller.research@gmail.com" },
    { name = "Dirk-Jan van Manen" },
]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "pylops>=2.3",          # provides waveeqprocessing.MDD
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "pint>=0.23"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 100
target-version = "py310"
